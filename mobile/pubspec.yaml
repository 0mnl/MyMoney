name: mymoney
description: MyMoney — personal and family finance manager. Offline First.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (see ADR-0001)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local DB (Offline First source of truth)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # HTTP client (sync + auth)
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.4.0

  # Data classes / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure storage for JWT refresh token
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
