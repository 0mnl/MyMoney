name: mymoney
description: MyMoney — personal and family finance manager. Offline First.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (see ADR-0001)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local DB (Offline First source of truth)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # HTTP client (sync + auth)
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.4.0

  # Secure storage for JWT refresh token (used in Etap 4)
  flutter_secure_storage: ^9.2.2

  # Non-secret user preferences (userId, familyId, first-launch seed flag)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation (only what's needed for Etap 1 — Isar).
  # freezed / json_serializable / riverpod_generator will be added back
  # if/when we start using them; keeping them out avoids version conflicts
  # between isar_generator (analyzer <6) and freezed (analyzer ^6.5).
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
