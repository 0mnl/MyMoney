ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ mymoney.ApplicationKt.module ]
    }
}

app {
    # "development" | "production" — управляет обязательностью override-ов секретов
    env = "development"
    env = ${?APP_ENV}
}

db {
    url      = "jdbc:postgresql://localhost:5432/mymoney"
    url      = ${?DB_URL}
    user     = "mymoney"
    user     = ${?DB_USER}
    password = "mymoney_dev_password"
    password = ${?DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DB_POOL_SIZE}
}

jwt {
    issuer                   = "mymoney"
    issuer                   = ${?JWT_ISSUER}
    audience                 = "mymoney-mobile"
    audience                 = ${?JWT_AUDIENCE}
    realm                    = "mymoney"
    secret                   = "dev-only-change-me-in-production"
    secret                   = ${?JWT_SECRET}
    accessTokenTtlMinutes    = 15
    accessTokenTtlMinutes    = ${?JWT_ACCESS_TTL_MINUTES}
    refreshTokenTtlDays      = 30
    refreshTokenTtlDays      = ${?JWT_REFRESH_TTL_DAYS}
}

registration {
    # Кто может завести аккаунт. Через запятую: полный адрес
    # (ivan@example.com) или домен (@example.com — пускает всех из него).
    # ПУСТО = регистрация открыта всем.
    allowlist = ""
    allowlist = ${?REGISTRATION_ALLOWLIST}
}

http {
    # Источники для CORS. Мобильному клиенту это не нужно — CORS проверяет
    # браузер, а не Dio. Заполнять только если появится веб-клиент.
    # ПУСТО в production = CORS выключен полностью (самый безопасный режим);
    # в development автоматически разрешается любой источник.
    allowedOrigins = ""
    allowedOrigins = ${?HTTP_ALLOWED_ORIGINS}
}

mail {
    # Пусто — работает LoggingVerificationCodeSender: коды пишутся в лог,
    # письма не отправляются. Заполните host, чтобы включить SMTP.
    host        = ""
    host        = ${?MAIL_HOST}
    port        = 587
    port        = ${?MAIL_PORT}
    username    = ""
    username    = ${?MAIL_USERNAME}
    password    = ""
    password    = ${?MAIL_PASSWORD}
    from        = "no-reply@mymoney.local"
    from        = ${?MAIL_FROM}
    fromName    = "MyMoney"
    fromName    = ${?MAIL_FROM_NAME}
    # STARTTLS (587) — обычный выбор; implicit TLS (465) — ssl = true.
    startTls    = true
    startTls    = ${?MAIL_STARTTLS}
    ssl         = false
    ssl         = ${?MAIL_SSL}
}
