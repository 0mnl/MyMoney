[versions]
kotlin = "2.1.0"
ktor = "3.0.3"
exposed = "0.57.0"
flyway = "10.20.0"
hikari = "6.2.1"
postgres = "42.7.4"
koin = "4.0.0"
kotlinx-serialization = "1.7.3"
kotlinx-datetime = "0.6.1"
kotlinx-coroutines = "1.9.0"
logback = "1.5.12"
argon2 = "2.11"
testcontainers = "1.20.4"
junit = "5.11.3"

[libraries]
# Ktor server
ktor-server-core            = { module = "io.ktor:ktor-server-core",                    version.ref = "ktor" }
ktor-server-netty           = { module = "io.ktor:ktor-server-netty",                   version.ref = "ktor" }
ktor-server-config-yaml     = { module = "io.ktor:ktor-server-config-yaml",             version.ref = "ktor" }
ktor-server-content-neg     = { module = "io.ktor:ktor-server-content-negotiation",     version.ref = "ktor" }
ktor-server-auth            = { module = "io.ktor:ktor-server-auth",                    version.ref = "ktor" }
ktor-server-auth-jwt        = { module = "io.ktor:ktor-server-auth-jwt",                version.ref = "ktor" }
ktor-server-status-pages    = { module = "io.ktor:ktor-server-status-pages",            version.ref = "ktor" }
ktor-server-cors            = { module = "io.ktor:ktor-server-cors",                    version.ref = "ktor" }
ktor-server-call-logging    = { module = "io.ktor:ktor-server-call-logging",            version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers",         version.ref = "ktor" }
ktor-server-request-valid   = { module = "io.ktor:ktor-server-request-validation",      version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json",     version.ref = "ktor" }

# Ktor client (used later for external integrations if needed)
ktor-client-core            = { module = "io.ktor:ktor-client-core",                    version.ref = "ktor" }
ktor-client-cio             = { module = "io.ktor:ktor-client-cio",                     version.ref = "ktor" }

# Kotlin core
kotlinx-serialization       = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime            = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }

# DB
exposed-core                = { module = "org.jetbrains.exposed:exposed-core",           version.ref = "exposed" }
exposed-jdbc                = { module = "org.jetbrains.exposed:exposed-jdbc",           version.ref = "exposed" }
exposed-kotlin-datetime     = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json                = { module = "org.jetbrains.exposed:exposed-json",           version.ref = "exposed" }
hikaricp                    = { module = "com.zaxxer:HikariCP",                          version.ref = "hikari" }
postgres                    = { module = "org.postgresql:postgresql",                    version.ref = "postgres" }
flyway-core                 = { module = "org.flywaydb:flyway-core",                     version.ref = "flyway" }
flyway-postgres             = { module = "org.flywaydb:flyway-database-postgresql",      version.ref = "flyway" }

# DI
koin-core                   = { module = "io.insert-koin:koin-core",                     version.ref = "koin" }
koin-ktor                   = { module = "io.insert-koin:koin-ktor",                     version.ref = "koin" }
koin-slf4j                  = { module = "io.insert-koin:koin-logger-slf4j",             version.ref = "koin" }

# Security
argon2                      = { module = "de.mkammerer:argon2-jvm",                      version.ref = "argon2" }

# Logging
logback-classic             = { module = "ch.qos.logback:logback-classic",               version.ref = "logback" }

# Test
ktor-server-test            = { module = "io.ktor:ktor-server-test-host",                version.ref = "ktor" }
kotlin-test                 = { module = "org.jetbrains.kotlin:kotlin-test",              version.ref = "kotlin" }
kotlin-test-junit5          = { module = "org.jetbrains.kotlin:kotlin-test-junit5",       version.ref = "kotlin" }
junit-jupiter               = { module = "org.junit.jupiter:junit-jupiter",               version.ref = "junit" }
testcontainers-postgres     = { module = "org.testcontainers:postgresql",                version.ref = "testcontainers" }
testcontainers-junit        = { module = "org.testcontainers:junit-jupiter",             version.ref = "testcontainers" }
koin-test                   = { module = "io.insert-koin:koin-test",                     version.ref = "koin" }
koin-test-junit5            = { module = "io.insert-koin:koin-test-junit5",              version.ref = "koin" }

[plugins]
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",                          version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",         version.ref = "kotlin" }
ktor                        = { id = "io.ktor.plugin",                                    version.ref = "ktor" }
flyway                      = { id = "org.flywaydb.flyway",                               version.ref = "flyway" }
