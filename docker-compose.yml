services:
  postgres:
    image: postgres:16-alpine
    container_name: mymoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mymoney}
      POSTGRES_USER: ${POSTGRES_USER:-mymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mymoney_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mymoney} -d ${POSTGRES_DB:-mymoney}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: mymoney-postgres-data
